<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Unifold vs Fun.xyz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* One screen, no scrolling: white page, a label column, Fun.xyz in dark grey and Unifold in green. */
:root{
  --bg:#FFFFFF; --ink:#1E2321; --mute:#6A726D; --line:#E6E9E6;
  --f-col:#3A3F3D; --f-head:#2F3331; --f-ink:#ECEFEC; --f-mute:#B3BBB6; --f-no:#8B948E;
  --u-col:#2A744F; --u-head:#1F5E3F; --u-ink:#F4FBF7; --u-mute:#E4F4EA; --u-yes:#F4FBF7;
  --lab-col:#FFFFFF;
  --face:'Inter','Helvetica Neue',Arial,sans-serif;
  /* type scale: the only font sizes used on the page */
  --t-xs:13px; --t-sm:14px; --t-md:16px; --t-lg:20px; --t-xl:24px;
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--bg)}
body{margin:0;font-family:var(--face);font-size:var(--t-md);line-height:1.3;color:var(--ink);background:var(--bg);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #2A744F;outline-offset:-3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.page{min-height:100%;display:flex;justify-content:center;align-items:flex-start;padding-block:clamp(20px,7vh,72px) 32px}
.mat{width:100%;max-width:800px;padding:clamp(6px,1.2vw,12px);border-radius:26px;background:#F5F6F5;border:1px solid #E1E5E1;display:grid;gap:clamp(8px,1.4vh,12px)}
.cap-out{text-align:center;color:var(--mute);font-size:var(--t-sm);font-weight:600;padding-bottom:2px}
.board{display:grid;grid-template-rows:auto auto;border-radius:20px;overflow:hidden;background:var(--lab-col);border:1px solid #E1E5E1;box-shadow:none}
.cols{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.3fr) minmax(0,1.3fr)}
.cols>*{min-width:0}
.head{height:clamp(42px,6.4vh,54px)}
.head>div{display:flex;align-items:center;gap:clamp(6px,1vw,10px);padding-inline:clamp(8px,1.6vw,20px)}
.head .lab{color:var(--mute);font-size:var(--t-sm);font-weight:700;line-height:1.2}
.head .f{background:var(--f-head);color:var(--f-ink);font-weight:700;font-size:var(--t-lg);letter-spacing:-0.03em}
.head .u{background:var(--u-head);color:var(--u-ink);font-weight:800;font-size:var(--t-lg);letter-spacing:-0.04em}
.logo{width:clamp(22px,3.4vh,28px);height:clamp(22px,3.4vh,28px);border-radius:22%;flex:none;display:block}

#chart{display:grid;--rowh:clamp(44px,6.6vh,56px)}
.row{position:relative;width:100%;min-height:0;border:0;background:transparent;padding:0;text-align:left;cursor:pointer;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.3fr) minmax(0,1.3fr)}
.cell{display:flex;align-items:center;gap:clamp(8px,1.2vw,14px);min-width:0;min-height:0;padding:6px clamp(8px,1.6vw,20px);border-top:1px solid var(--line);transition:background .12s}
.cell.lab{background:var(--lab-col);color:var(--ink);font-weight:700;font-size:var(--t-sm);line-height:1.15;letter-spacing:-0.01em}
.cell.f{background:var(--f-col);color:var(--f-ink);border-top-color:rgba(255,255,255,.1)}
.cell.u{background:var(--u-col);color:var(--u-ink);border-top-color:rgba(255,255,255,.2);padding-right:clamp(32px,4vw,44px);position:relative}
.row:hover .cell.f,.row:focus-visible .cell.f{background:#454B48}
.row:hover .cell.u,.row:focus-visible .cell.u{background:#33865D}
.row:hover .cell.lab,.row:focus-visible .cell.lab{background:#F1F3F1}
.stack{display:flex;flex-direction:column;gap:2px;min-width:0}
.val{font-weight:700;font-size:var(--t-lg);line-height:1;letter-spacing:-0.04em}
.f .val{color:var(--f-ink);font-weight:700}
.u .val{color:var(--u-ink)}
.small{font-size:var(--t-xs);font-weight:600;line-height:1.2}
.lang,.ic+.small{font-size:var(--t-sm);line-height:1.3}
.cell>.small{min-width:0}
.f .small{color:var(--f-mute)}
.u .small{color:var(--u-mute)}
.ic{flex:none;width:clamp(20px,3vh,26px);height:clamp(20px,3vh,26px);border-radius:50%;display:grid;place-items:center}
.ic svg{width:58%;height:58%}
.ic.yes{background:var(--u-yes);color:#1F6F49}
.ic.no{border:2px solid var(--f-no);color:var(--f-no)}
.play{position:absolute;right:clamp(10px,1.6vw,22px);top:50%;transform:translateY(-50%);width:clamp(20px,2.9vh,24px);height:clamp(20px,2.9vh,24px);border-radius:50%;background:rgba(255,255,255,.2);color:var(--u-ink);display:grid;place-items:center}
.play{transition:background .18s,color .18s,transform .35s var(--ease)}
.play svg{width:46%;height:46%;margin-left:8%;transition:transform .35s var(--ease)}
.play::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--u-yes);opacity:0;pointer-events:none}
.row:hover .play,.row:focus-visible .play{transform:translateY(-50%) scale(1.14)}
.row:hover .play svg,.row:focus-visible .play svg{transform:translateX(1px) scale(1.08)}
.row:active .play{transform:translateY(-50%) scale(.9);transition-duration:.08s}
.row.fired .play::after{animation:ring .6s var(--ease)}
@keyframes ring{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(2.4)}}
.row.static{cursor:default}
.row.static:hover .cell.f{background:var(--f-col)}
.row.static:hover .cell.u{background:var(--u-col)}
.row.static:hover .cell.lab{background:var(--lab-col)}
.row:hover .play{background:var(--u-yes);color:#1F6F49}

/* viewer */
.veil{position:fixed;inset:0;background:rgba(20,24,22,.45);display:flex;opacity:0;visibility:hidden;transition:opacity .22s ease,visibility 0s .22s;align-items:center;justify-content:center;z-index:50;
  padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.veil.open{opacity:1;visibility:visible;transition:opacity .22s ease,visibility 0s}
.sheet{transform:scale(.55);opacity:0;transition:transform .22s ease-in,opacity .18s ease-in}
.veil.open .sheet{transform:none;opacity:1;transition:transform .5s var(--ease),opacity .25s ease-out}
.pane{animation:rise .45s var(--ease) both}
.pane.u{animation-delay:.06s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .veil,.veil.open,.sheet,.veil.open .sheet,.play,.play svg{transition-duration:.01s!important;transition-delay:0s!important}
  .pane,.row.fired .play::after{animation:none!important}
  .row:hover .play,.row:focus-visible .play,.row:active .play{transform:translateY(-50%)}
}
.sheet{width:min(1240px,100%);height:min(740px,100%);overflow:hidden;border-radius:22px;display:grid;grid-template-rows:auto minmax(0,1fr);
  background:linear-gradient(to right,var(--f-col) 50%,var(--u-col) 50%)}
.sheet-top{display:flex;align-items:center;gap:10px;padding:12px;background:var(--lab-col);color:var(--ink)}
.sheet-top h2{font-weight:800;font-size:var(--t-xl);line-height:1.1;letter-spacing:-0.03em;margin:0;flex:1}
.nav{width:42px;height:42px;border-radius:50%;border:0;background:#EEF1EE;color:var(--ink);cursor:pointer;display:grid;place-items:center;flex:none}
.nav svg{width:20px;height:20px}
.nav:hover{background:#2A744F;color:#fff}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:0}
.pane{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;min-width:0;min-height:0;padding:clamp(10px,2vw,22px)}
.pane.f{color:var(--f-ink)}
.pane.u{color:var(--u-ink)}
.pane h3{margin:0;font-weight:800;font-size:var(--t-lg);line-height:1;letter-spacing:-0.02em;display:flex;align-items:center;gap:10px}
.pane h3 img{width:32px;height:32px;border-radius:22%}
.frame{position:relative;min-height:0;border:2px dashed;border-radius:16px;display:grid;place-items:center;overflow:hidden;cursor:pointer;font-size:var(--t-sm);text-align:center;padding:12px}
.pane.f .frame{border-color:#6B736E;background:#2F3331;color:var(--f-mute)}
.pane.u .frame{border-color:#8CCBA8;background:#256A47;color:var(--u-mute)}
.frame:hover{border-color:var(--u-yes)}
.frame img,.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.frame input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.frame.stack{display:grid;grid-auto-rows:minmax(0,1fr);gap:10px;place-items:stretch;padding:10px;cursor:default;border-style:solid}
.frame.stack img{position:static;height:100%;min-height:0;width:100%;object-fit:contain;border-radius:10px;background:#15181F}
.frame.none{border-style:solid;cursor:default;font-weight:600;font-size:var(--t-lg)}
.cap{font-size:var(--t-sm);font-weight:500;min-height:1.3em}
.pane.f .cap{color:var(--f-mute)}
.pane.u .cap{color:var(--u-mute)}

@media (max-width:560px){
  :root{--t-xs:12px;--t-sm:13px;--t-md:15px;--t-lg:18px;--t-xl:20px}
  .board{border-radius:16px}
  .cols,.row{grid-template-columns:minmax(0,.72fr) minmax(0,1fr) minmax(0,1fr)}
  .head .logo{display:none}
  .cell.u{padding-right:40px}
  .play{width:24px;height:24px;right:8px}
}
</style>
</head>

  var YES='<span class="ic yes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>';

  function val(v,s){return '<span class="stack"><span class="val">'+v+'</span>'+(s?'<span class="small">'+s+'</span>':'')+'</span>'}
  function yes(s){return YES+(s?'<span class="small">'+s+'</span>':'<span class="sr">Yes</span>')}
  function no(s){return NO+(s?'<span class="small">'+s+'</span>':'<span class="sr">No</span>')}
  var ROWS=[
    {id:"providers",label:"Ramp providers",f:val("1","Swapped"),u:val("3+","Coinbase, Stripe, Swapped, etc"),title:"Ramp providers",fc:"Swapped only",uc:"Coinbase, Stripe, Swapped, etc"},
    {id:"lowkyc",label:"Low or no KYC",f:no("Redirects to Swapped widget"),u:yes("Stripe, Coinbase"),title:"Low or no KYC",fc:"Swapped doesn't offer low or no KYC. Often a redirect to the Swapped widget",uc:"Stripe US/EU, Coinbase US"},
    {id:"approval",nomedia:true,label:"Approval rates",f:val("Low","Credit card approvals"),u:val("High","Credit card approvals"),title:"Approval rates",fc:"Low credit card approval rates. Swapped has no MiCA license and uses a different provider for MiCA",uc:"High credit card approval rates. Stripe has the highest approval rates"},

    {id:"cashapp",nomedia:true,label:"Cash App",f:no(),u:yes(),title:"Cash App",fc:"",uc:"Cash App deposit",nofun:true},

  var PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>';

  chart.style.gridTemplateRows="repeat("+ROWS.length+",minmax(var(--rowh),auto))";
  ROWS.forEach(function(r,i){
    var b=document.createElement(r.nomedia?"div":"button");
    b.className="row"+(r.nomedia?" static":""); if(r.nomedia){b.setAttribute("role","listitem");}else{b.type="button"; b.setAttribute("aria-label",r.label+": open flows");}
    b.innerHTML='<div class="cell lab">'+r.label+'</div><div class="cell f">'+r.f+'</div><div class="cell u">'+r.u+(r.nomedia?'':'<span class="play" aria-hidden="true">'+PLAY+'</span>')+'</div>';
    if(!r.nomedia)b.addEventListener("click",function(){b.classList.remove("fired");void b.offsetWidth;b.classList.add("fired");open(i,b)});
    chart.appendChild(b);
  });

  var veil=document.getElementById("veil"),pair=document.getElementById("pair"),vt=document.getElementById("vt");
  var cur=0,opener=null,previews={};
  function pane(side,r){
    var name=side==="fun"?"Fun.xyz":"Unifold", key=r.id+"-"+side;
    var cap=side==="fun"?r.fc:r.uc;
    var div=document.createElement("div"); div.className="pane "+(side==="fun"?"f":"u");
    var h=document.createElement("h3"); var lg=document.createElement("img"); lg.src=side==="fun"?LOGO.fun:LOGO.uni; lg.alt=""; h.appendChild(lg); h.appendChild(document.createTextNode(name)); div.appendChild(h);
    var frame=document.createElement("label"); frame.className="frame";
    var c=document.createElement("div"); c.className="cap"; c.textContent=cap;
    if(side==="fun"&&r.nofun){frame.className="frame none";frame.textContent="Not offered";div.appendChild(frame);div.appendChild(c);return div;}
    var src=previews[key]||(MEDIA[r.id]&&MEDIA[r.id][side]);
    if(src&&src.multi){
      frame.className="frame stack";
      src.multi.forEach(function(m){var im=document.createElement("img");im.src=m.url;im.alt=m.alt;frame.appendChild(im);});
      div.appendChild(frame);div.appendChild(c);return div;
    }
    if(src){media(frame,src.url,src.type);}
    else{var sp=document.createElement("span"); sp.textContent="Add a GIF, image or video"; frame.appendChild(sp);}
    var inp=document.createElement("input"); inp.type="file"; inp.accept="image/*,video/*";
    inp.setAttribute("aria-label",name+" recording for "+r.label);
    inp.addEventListener("change",function(){
      var f=inp.files&&inp.files[0]; if(!f)return;
      previews[key]={url:URL.createObjectURL(f),type:f.type.indexOf("video")===0?"video":"image"};
      render(cur);
    });
    frame.appendChild(inp);
    div.appendChild(frame);div.appendChild(c);
    return div;
  }
  function media(frame,url,type){
    var el;
    if(type==="video"){el=document.createElement("video");el.src=url;el.controls=true;el.muted=true;el.loop=true;el.autoplay=true;el.playsInline=true;}
    else{el=document.createElement("img");el.src=url;el.alt="Flow recording";}
    frame.appendChild(el);
  }
  function render(i){
    cur=(i+ROWS.length)%ROWS.length; var r=ROWS[cur];
    vt.textContent=r.title; pair.innerHTML="";
    pair.appendChild(pane("fun",r)); pair.appendChild(pane("uni",r));
  }
  function open(i,from){opener=from||null;render(i);
    var sheet=veil.firstElementChild,pl=from&&from.querySelector(".play");
    if(pl){var a=pl.getBoundingClientRect(),vw=window.innerWidth,vh=window.innerHeight,sw=Math.min(1240,vw-28),sh=Math.min(740,vh-28);
      sheet.style.transformOrigin=(a.left+a.width/2-(vw-sw)/2)+"px "+(a.top+a.height/2-(vh-sh)/2)+"px";}
    else sheet.style.transformOrigin="50% 50%";
    veil.classList.add("open");veil.setAttribute("aria-hidden","false");document.getElementById("close").focus();}
  function close(){veil.classList.remove("open");setTimeout(function(){if(!veil.classList.contains("open"))[].forEach.call(pair.querySelectorAll("video"),function(v){v.pause()})},260);veil.setAttribute("aria-hidden","true");if(opener)opener.focus();}
  document.getElementById("close").addEventListener("click",close);
  document.getElementById("prev").addEventListener("click",function(){render(cur-1)});
  document.getElementById("next").addEventListener("click",function(){render(cur+1)});
  veil.addEventListener("click",function(e){if(e.target===veil)close()});
  document.addEventListener("keydown",function(e){
    if(!veil.classList.contains("open"))return;
    if(e.key==="Escape")close();
    else if(e.key==="ArrowLeft")render(cur-1);
    else if(e.key==="ArrowRight")render(cur+1);
  });
})();
